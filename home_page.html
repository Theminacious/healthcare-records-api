<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Healthcare Registration</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <div class="container">
        <h1>Healthcare Registration</h1>
        <div class="status-bar" id="status-bar">Ready to start...</div>

        <form id="reg-form">
            <div class="form-group">
                <label for="name">Name</label>
                <input type="text" id="name" placeholder="Enter your name" required>
            </div>
            <div class="form-group">
                <label>Email</label>
                <input type="email" id="email" placeholder="Enter email" required>
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="password" placeholder="Enter password" required>
            </div>
            <button type="submit" id="submit-btn" class="btn">Register Securely</button>
        </form>

        <div id="debug-info" style="margin-top:20px; color: #666; font-size: 0.8em;">
            <!-- Hidden debug info for the curious -->
        </div>
        <div id="result" class="result hidden"></div>
    </div>
    <script src="script.js"></script>
</body>

</html>
